services:
  db:
    image: postgres:17
    container_name: employee-management-db
    environment:
      POSTGRES_DB: employee_management_system_db
      POSTGRES_USER: employee_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U employee_app -d employee_management_system_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: employee-management-backend:1.0
    container_name: employee-management-backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/employee_management_system_db
      SPRING_DATASOURCE_USERNAME: employee_app
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

volumes:
  postgres_data: